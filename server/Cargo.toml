[package]
name = "cipherkey-server"
version = "1.0.0"
edition = "2021"
description = "Servidor de sincronización de CipherKey: solo almacena registros cifrados (E2E)."
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
